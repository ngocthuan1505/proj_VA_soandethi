<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · Mạch</title><link rel="stylesheet" href="/assets/online-login.css"></head>
<body><main><a href="/" class="brand">m<span>•</span></a><p class="eyebrow">MẠCH · BÀN SOẠN THÔNG MINH</p><h1>Chào thầy cô.</h1><p>Đăng nhập để tiếp tục soạn và mở kho đề riêng.</p>
<form id="online-login"><label>Email<input name="email" type="email" required autocomplete="username" maxlength="254"></label><label>Mật khẩu<input name="password" type="password" required autocomplete="current-password" maxlength="200"></label><div id="registration-fields" hidden><label>Họ tên<input name="name" autocomplete="name" maxlength="100"></label><label>Mã mời<input name="inviteCode" type="password" autocomplete="off"></label><small>Nhận mã mời từ người quản lý. Mật khẩu mới cần ít nhất 10 ký tự.</small></div><p id="login-error" role="alert"></p><button id="login-submit" type="submit">Đăng nhập</button></form>
<button id="registration-toggle" type="button">Có mã mời? Tạo tài khoản</button><p class="foot">Đề và hội thoại được lưu riêng theo tài khoản.</p></main><script type="module" src="/assets/online-login.js"></script></body></html>
