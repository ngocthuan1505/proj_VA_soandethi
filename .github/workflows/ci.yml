name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.6'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check src
      - name: Kiểm đường chạy Docker bằng FastAPI
        working-directory: .
        shell: bash
        run: |
          docker build --tag soande-python:ci .
          trap 'result=$?; if [ $result -ne 0 ]; then docker logs soande-python-ci || true; fi; docker rm -f -v soande-python-ci >/dev/null 2>&1 || true' EXIT
          docker run --detach --name soande-python-ci --publish 127.0.0.1::4182 soande-python:ci
          address="$(docker port soande-python-ci 4182/tcp)"
          base="http://$address"
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --max-time 5 --retry-max-time 30 "$base/openapi.json" > openapi.json
          jq -e '.paths["/api/exams/{exam_id}/matrix/approve"].post' openapi.json >/dev/null
          curl --fail --silent --show-error "$base/" | grep -F 'bootstrap.js' >/dev/null
          curl --fail --silent --show-error --request PUT \
            --header "Origin: $base" --header 'Content-Type: application/json' --header 'If-Match: 0' \
            --data '{"key":"state","value":{"exams":[],"prefs":[]}}' "$base/api/kv" >/dev/null
          curl --fail --silent --show-error "$base/api/kv?key=state" | jq -e '.value.exams == []'
          docker exec soande-python-ci sh -c '! command -v node && test "$(id -u)" = 10001'
  test:
    name: Legacy UI baseline and team plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Chọn Chrome có sẵn để kiểm tra PDF
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$browser_path"
          "$browser_path" --version
          echo "BROWSER_PATH=$browser_path" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run check:team
      - run: npm run build-editor
